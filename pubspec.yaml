name: connecso_client
description: CONNECSO Client, an Android-first consumer VPN application.
publish_to: none
version: 0.2.0+1

environment:
  sdk: ">=3.10.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_secure_storage: ^11.2.0
  cryptography: ^2.9.0
  mobile_scanner: ^7.4.2
  image_picker: ^1.2.3
  intl: ^0.20.2
  sqflite: ^2.4.2+1
  yaml: ^3.1.4
  workmanager: ^0.10.10

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.4.0+3

flutter:
  uses-material-design: true
  assets:
    - assets/connecso_team_logo.png
    - assets/logos/connecso_logo_dark.png
    - assets/logos/connecso_logo_light.png
    - assets/locations/locations.json
    - assets/maps/world_simplified.geojson
